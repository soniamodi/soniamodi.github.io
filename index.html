<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonia Modi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar">
    <h1>Sonia Modi</h1>
  </header>

  <main class="grid">
    <button class="tile" data-target="panel-1">About</button>
    <button class="tile" data-target="panel-2">Research</button>
    <button class="tile" data-target="panel-3">Projects</button>
    <button class="tile" data-target="panel-4">Leadership</button>
    <button class="tile" data-target="panel-5">Making</button>
    <button class="tile" data-target="panel-6">Contact</button>
  </main>

  <div class="overlay" id="overlay">
    <section class="panel" id="panel-1">
      <button class="close" aria-label="Close">&times;</button>
      <h2>About</h2>
      <p>Add your info here.</p>
    </section>
    <section class="panel" id="panel-2">
      <button class="close" aria-label="Close">&times;</button>
      <h2>Research</h2>
      <p>Add your info here.</p>
    </section>
    <section class="panel" id="panel-3">
      <button class="close" aria-label="Close">&times;</button>
      <h2>Projects</h2>
      <p>Add your info here.</p>
    </section>
    <section class="panel" id="panel-4">
      <button class="close" aria-label="Close">&times;</button>
      <h2>Leadership</h2>
      <p>Add your info here.</p>
    </section>
    <section class="panel" id="panel-5">
      <button class="close" aria-label="Close">&times;</button>
      <h2>Making</h2>
      <p>Add your info here.</p>
    </section>
    <section class="panel" id="panel-6">
      <button class="close" aria-label="Close">&times;</button>
      <h2>Contact</h2>
      <p>Add your info here.</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
